# Production, on the EC2 host (see infra/README.md). deploy/deploy.sh runs it from /opt/wsi; nothing else does.
# The database (RDS), the bucket (S3) and the broker (SQS) are AWS services, so the only state here is the slide cache,
# on its own EBS volume at /var/lib/wsi-cache. backend.env comes from SSM Parameter Store, IMAGE from deploy.sh.
x-backend: &backend
  image: ${IMAGE:?set by deploy/deploy.sh}
  env_file: backend.env
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  migrate:
    <<: *backend
    command: [ "alembic", "upgrade", "head" ]

  # Creates the ADMIN_USERNAME account on a fresh database; does nothing once it exists.
  create-admin:
    <<: *backend
    command: [ "python", "-m", "scripts.create_admin" ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    # The image's CMD: a single uvicorn process. Slide download locks, the open-slide cache and cache eviction live in
    # the process, so several workers would download, open and evict the same slides independently.
    ports:
      - "8000:8000"
    volumes:
      - /var/lib/wsi-cache:/var/lib/wsi-cache
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      create-admin:
        condition: service_completed_successfully

  # Saves the results the GPU worker posts to the segmentation-results queue.
  segmentation-consumer:
    <<: *backend
    command: [ "celery", "-A", "app.segmentation_consumer", "worker", "-Q", "segmentation-results", "--pool=solo", "--concurrency=1", "--without-gossip", "--without-mingle", "--without-heartbeat", "--loglevel=INFO" ]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Pushes host metrics, container metrics and every container's log to Grafana Cloud (perf/README.md). It reads the
  # host and the Docker socket read-only, and is memory-capped so it can't starve the API on this 2 GB host.
  alloy:
    image: grafana/alloy:v1.22.0
    command: [ "run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    # GRAFANA_CLOUD_* come with the app's settings.
    env_file: backend.env
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    # The host's cgroups, so cAdvisor sees every container.
    cgroup: host
    volumes:
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /run/udev/data:/run/udev/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
      # Where it stopped reading each log, so a recreated container doesn't send old lines again.
      - alloy_data:/var/lib/alloy/data
    mem_limit: 200m
    cpus: "0.5"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  alloy_data:

configs:
  alloy:
    content: |
      // Host metrics (node exporter), container metrics (cAdvisor) and every container's log, pushed to Grafana Cloud.
      prometheus.exporter.unix "host" {
        procfs_path    = "/host/proc"
        rootfs_path    = "/host/root"
        set_collectors = ["cpu", "diskstats", "filesystem", "loadavg", "meminfo", "netdev", "pressure", "vmstat"]
      }

      prometheus.exporter.cadvisor "containers" {
        docker_only      = true
        enabled_metrics  = ["cpu", "diskIO", "memory", "network", "oom_event"]
        storage_duration = "2m"
      }

      prometheus.scrape "local" {
        targets         = array.concat(prometheus.exporter.unix.host.targets, prometheus.exporter.cadvisor.containers.targets)
        scrape_interval = "15s"
        forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
      }

      prometheus.remote_write "grafana_cloud" {
        external_labels = { host = "wsi-backend" }
        endpoint {
          url = sys.env("GRAFANA_CLOUD_PROMETHEUS_URL")
          basic_auth {
            username = sys.env("GRAFANA_CLOUD_PROMETHEUS_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }

      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = []
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
      }

      loki.source.docker "containers" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.containers.targets
        relabel_rules = discovery.relabel.containers.rules
        forward_to    = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        external_labels = { host = "wsi-backend" }
        endpoint {
          url = sys.env("GRAFANA_CLOUD_LOKI_URL")
          basic_auth {
            username = sys.env("GRAFANA_CLOUD_LOKI_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }
