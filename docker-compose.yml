# Every service loads its config from .env.local via env_file (not ${VAR} interpolation), so
# `docker compose up` needs no --env-file flag and cannot silently see blank credentials.
# Nothing stateful runs here: the database is RDS and slides live in S3 (see infra/). Containers
# reach RDS through Docker's NAT, so the source address is the host's public IP and the security
# group's /32 rule keeps working.
services:
  api:
    build: .
    # --reload is what the source bind mount below is for; the image's own copy is used by the migrate service.
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload" ]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Kept outside the /app bind mount so cached slides never land in the repository.
      - slide_cache:/var/lib/wsi-cache
    env_file: .env.local
    environment:
      SLIDE_CACHE_DIR: /var/lib/wsi-cache
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: [ "alembic", "upgrade", "head" ]
    env_file: .env.local

volumes:
  slide_cache:
