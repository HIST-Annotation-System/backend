x-backend-environment: &backend-environment
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-histopathology-patches}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wsi}:${POSTGRES_PASSWORD:-wsi}@db:5432/${POSTGRES_DB:-wsi}
  SLIDE_CACHE_DIR: /var/lib/wsi-cache

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Kept outside the /app bind mount so cached slides never land in the repository.
      - slide_cache:/var/lib/wsi-cache
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      # 5433 on the host avoids clashing with a natively installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-wsi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wsi}
      - POSTGRES_DB=${POSTGRES_DB:-wsi}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    command: server /data --console-address ":9001"

volumes:
  minio_data:
  postgres_data:
  slide_cache:
