x-backend-environment: &backend-environment
  BUCKET_ENDPOINT: ${BUCKET_ENDPOINT}
  BUCKET_PUBLIC_ENDPOINT: ${BUCKET_PUBLIC_ENDPOINT}
  BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY}
  BUCKET_SECRET_KEY: ${BUCKET_SECRET_KEY}
  BUCKET_NAME: ${BUCKET_NAME}
  BUCKET_REGION: ${BUCKET_REGION}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SLIDE_CACHE_DIR: /var/lib/wsi-cache
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Kept outside the /app bind mount so cached slides never land in the repository.
      - slide_cache:/var/lib/wsi-cache
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      # 5433 on the host avoids clashing with a natively installed PostgreSQL.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12




volumes:
  postgres_data:
  slide_cache:
