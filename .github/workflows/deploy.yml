name: Deploy

# Every push to main goes to production: the image is built for the ARM host, pushed to ECR and started there through
# SSM, which runs the database migrations first. AWS access is a short-lived OIDC role (infra/), no stored keys.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Native ARM runner (free for public repositories): the EC2 host is a t4g (Graviton).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image on the host
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          compose=$(base64 -w0 docker-compose.prod.yml)
          script=$(base64 -w0 deploy/deploy.sh)
          parameters=$(jq -n --arg compose "$compose" --arg script "$script" --arg image "$IMAGE" '{
            commands: [
              "mkdir -p /opt/wsi",
              "echo \($compose) | base64 -d > /opt/wsi/docker-compose.prod.yml",
              "echo \($script) | base64 -d > /opt/wsi/deploy.sh",
              "bash /opt/wsi/deploy.sh \($image)"
            ],
            executionTimeout: ["900"]
          }')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters "$parameters" --query Command.CommandId --output text)
          echo "SSM command $command_id"
          # `aws ssm wait` gives up after 100 s; pulling the image and migrating can take longer.
          for _ in $(seq 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending | InProgress | Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          test "$status" = Success
